[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rag-adapt-lab"
version = "0.2.0"
description = "Domain-neutral RAG vs SFT vs RAFT experiment harness with W&B Models and Weave integration"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "rag-adapt-lab contributors" }]
keywords = ["rag", "raft", "qlora", "wandb", "weave", "llm", "domain-adaptation"]
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
rag = [
  "rank-bm25==0.2.2",
  "sentence-transformers==5.7.0",
  "faiss-cpu==1.15.0",
  "openai==2.53.0",
]
train = [
  "torch==2.11.0",
  "transformers==4.57.6",
  "datasets==4.8.5",
  "accelerate==1.14.0",
  "peft==0.20.0",
  "trl==0.24.0",
  "bitsandbytes==0.50.0; platform_system == 'Linux'",
]
wandb = [
  "wandb>=0.19,<1",
  "weave>=0.52,<1",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
raglab = "rag_adapt_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_adapt_lab"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: real CPU dependency integration tests",
  "gpu: real CUDA training and generation integration tests",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
