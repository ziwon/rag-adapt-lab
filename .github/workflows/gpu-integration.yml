name: gpu-integration

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  gpu-integration-tests:
    name: GPU integration (tiny LoRA and benchmark)
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned real dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[rag,train,dev]'
      - name: Verify CUDA and run real GPU path
        env:
          RAGLAB_RUN_GPU_INTEGRATION: '1'
          WANDB_MODE: disabled
        run: pytest -m gpu -vv
