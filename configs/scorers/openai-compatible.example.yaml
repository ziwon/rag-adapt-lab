mode: enabled
lexical_groundedness:
  claim_support_threshold: 0.5
citation_metrics: false
judge:
  kind: openai-compatible
  base_url: http://localhost:8000/v1
  model: local-judge-model
  model_revision: deployment-specific-immutable-id
  api_key_env: JUDGE_API_KEY
  strict: false
  timeout_seconds: 30
  connection_timeout_seconds: 10
  read_timeout_seconds: 30
  max_retries: 2
  retry_backoff_seconds: 0.5
  max_response_bytes: 32768
  max_completion_tokens: 256
  max_rationale_characters: 1000
  cache: true
  cache_path: .cache/raglab/judge-cache.sqlite3
  concurrency_limit: 1
  minimum_metric_coverage: 0.8
  minimum_paired_examples: 30
  structured_output: true
